<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamify - Free Music Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-black text-white font-sans h-screen flex flex-col overflow-hidden">

    <!-- Top Navigation -->
    <header class="bg-zinc-900 border-b border-zinc-800 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-compact-disc text-red-500 text-3xl"></i>
            <span class="text-xl font-bold tracking-tight">Streamify</span>
        </div>

        <div class="flex-1 max-w-md mx-6">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-zinc-400"></i>
                <input id="searchInput" type="text" placeholder="Search any song, artist, or podcast..." 
                    class="w-full bg-zinc-800 text-white rounded-full pl-11 pr-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-500 transition">
            </div>
        </div>

        <div class="text-xs text-zinc-400 bg-zinc-800 px-3 py-1.5 rounded-full border border-zinc-700">
            Free Engine Active
        </div>
    </header>

    <!-- Main Content -->
    <div class="flex flex-1 overflow-hidden">
        <aside class="w-64 bg-zinc-950 border-r border-zinc-800 p-4 hidden md:flex flex-col justify-between">
            <div class="space-y-6">
                <div>
                    <h2 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-3 px-2">Quick Genres</h2>
                    <nav class="space-y-1">
                        <button onclick="searchMusic('Trending Music Hits')" class="w-full text-left px-3 py-2 rounded-lg bg-zinc-800 text-white text-sm font-medium flex items-center space-x-3">
                            <i class="fa-solid fa-fire text-red-500"></i>
                            <span>Trending Now</span>
                        </button>
                        <button onclick="searchMusic('Top Pop Hits')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-zinc-800 text-zinc-400 hover:text-white text-sm font-medium flex items-center space-x-3">
                            <i class="fa-solid fa-music"></i>
                            <span>Pop Hits</span>
                        </button>
                    </nav>
                </div>

                <!-- Spotify Import Feature -->
                <div>
                    <h2 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-3 px-2">Import YouTube Playlist</h2>
                    <div class="space-y-2 px-2">
                        <input id="spotifyUrlInput" type="text" placeholder="Paste YouTube Playlist Link..." 
                            class="w-full bg-zinc-800 text-white rounded-lg px-3 py-2 text-xs focus:outline-none focus:ring-1 focus:ring-red-500">
                        <button onclick="importSpotifyPlaylist()" class="w-full bg-red-600 hover:bg-red-500 text-white text-xs font-semibold py-2 rounded-lg transition">
                            Import Playlist
                        </button>
                    </div>
                </div>
            </div>

            <div class="text-xs text-zinc-600 px-2">
                YouTube Playback Engine
            </div>
        </aside>

        <main class="flex-1 bg-zinc-900/50 p-6 overflow-y-auto">
            <div class="max-w-6xl mx-auto">
                <h1 id="sectionTitle" class="text-2xl font-bold mb-6">Trending Music</h1>
                <div id="contentGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
            </div>
        </main>
    </div>

    <!-- Bottom Audio Player -->
    <footer class="bg-zinc-950 border-t border-zinc-800 px-6 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-4 w-1/3">
            <img id="nowPlayingImg" class="w-12 h-12 rounded bg-zinc-800 object-cover" src="https://via.placeholder.com/48?text=Music" alt="Cover">
            <div class="truncate">
                <p id="nowPlayingTitle" class="text-sm font-medium text-white truncate">Select a track</p>
                <p id="nowPlayingArtist" class="text-xs text-zinc-400 truncate">100% Free Full Length</p>
            </div>
        </div>

        <div class="w-1/3 flex justify-center">
            <div id="playerContainer" class="w-full h-16 rounded-lg overflow-hidden hidden">
                <iframe id="playerEmbed" class="w-full h-full" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
            <div id="placeholderPlayer" class="text-center text-xs text-zinc-500">
                Click any track to start listening.
            </div>
        </div>

        <div class="w-1/3 flex justify-end"></div>
    </footer>

    <script>
        const API_KEY = 'AIzaSyDU2YnkaSoDVIquAVH-A3ayRcByayhpAkA';

        window.addEventListener('DOMContentLoaded', () => {
            searchMusic('Trending Music Hits');

            let timeout = null;
            document.getElementById('searchInput').addEventListener('input', (e) => {
                clearTimeout(timeout);
                timeout = setTimeout(() => {
                    const query = e.target.value.trim();
                    searchMusic(query || 'Trending Music Hits');
                }, 400);
            });
        });

        async function searchMusic(query) {
            document.getElementById('sectionTitle').textContent = query;
            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=20&q=${encodeURIComponent(query)}&type=video&key=${API_KEY}`;
            
            try {
                const res = await fetch(url);
                const data = await res.json();
                
                if (data.items) {
                    const results = data.items.map(item => ({
                        id: item.id.videoId,
                        title: item.snippet.title,
                        subtitle: item.snippet.channelTitle,
                        image: item.snippet.thumbnails.high.url
                    }));
                    renderGrid(results);
                }
            } catch (err) {
                console.error("API Error:", err);
            }
        }

async function importSpotifyPlaylist() {
            const input = document.getElementById('spotifyUrlInput').value.trim();
            if (!input) return;

            // Extract YouTube Playlist ID
            const ytMatch = input.match(/[&?]list=([^&]+)/) || input.match(/^PL[a-zA-Z0-9_-]+$/);
            const playlistId = ytMatch ? (ytMatch[1] || ytMatch[0]) : null;

            if (!playlistId) {
                alert("Please paste a valid YouTube Playlist URL or ID.");
                return;
            }

            document.getElementById('sectionTitle').textContent = "Fetching Playlist Tracks...";

            // Fetch individual tracks inside the YouTube Playlist
            const url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=${playlistId}&key=${API_KEY}`;

            try {
                const res = await fetch(url);
                const data = await res.json();

                if (data.items) {
                    const results = data.items.map(item => ({
                        id: item.snippet.resourceId.videoId,
                        title: item.snippet.title,
                        subtitle: item.snippet.videoOwnerChannelTitle || item.snippet.channelTitle,
                        image: item.snippet.thumbnails.high ? item.snippet.thumbnails.high.url : item.snippet.thumbnails.default.url
                    }));
                    renderGrid(results);
                    document.getElementById('sectionTitle').textContent = "Imported Playlist Tracks";
                } else {
                    document.getElementById('sectionTitle').textContent = "No tracks found in playlist.";
                }
            } catch (err) {
                console.error("API Error:", err);
                document.getElementById('sectionTitle').textContent = "Failed to load playlist.";
            }
        }

        function renderGrid(items) {
            const grid = document.getElementById('contentGrid');
            grid.innerHTML = '';

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'bg-zinc-800/40 p-3 rounded-lg hover:bg-zinc-800 transition cursor-pointer group flex flex-col justify-between';
                card.onclick = () => playTrack(item);

                card.innerHTML = `
                    <div class="relative mb-3">
                        <img src="${item.image}" class="w-full aspect-square object-cover rounded-md shadow-lg" alt="${item.title}">
                        <button class="absolute bottom-2 right-2 bg-red-500 text-white rounded-full p-3 opacity-0 group-hover:opacity-100 transition shadow-xl transform translate-y-2 group-hover:translate-y-0">
                            <i class="fa-solid fa-play text-sm"></i>
                        </button>
                    </div>
                    <div>
                        <h3 class="font-semibold text-sm truncate text-white">${item.title}</h3>
                        <p class="text-xs text-zinc-400 truncate mt-1">${item.subtitle}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function playTrack(item) {
            document.getElementById('nowPlayingImg').src = item.image;
            document.getElementById('nowPlayingTitle').textContent = item.title;
            document.getElementById('nowPlayingArtist').textContent = item.subtitle;

            const embedUrl = `https://www.youtube.com/embed/${item.id}?autoplay=1`;
            document.getElementById('playerEmbed').src = embedUrl;
            document.getElementById('playerContainer').classList.remove('hidden');
            document.getElementById('placeholderPlayer').classList.add('hidden');
        }
    </script>
</body>
</html>
